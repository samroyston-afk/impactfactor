<!DOCTYPE html>
<html lang="en-GB">
<head>

<title>How impact ready are you? - Impact Factor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3A5C;--teal:#0B8A7A;--amber:#E8A020;--white:#fff;
  --light:#EEF7F5;--light2:#F5FAFA;--text:#162030;--mid:#3D5A73;--muted:#6A8FA8;
  --teal-light:#5ED8C8;--line:#e0edeb;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;color:var(--text);background:var(--light2);line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 1.5rem}
.hidden{display:none!important}

/* HEADER */
header{background:var(--navy);padding:1.1rem 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand .w1{font-weight:700;font-size:.92rem;letter-spacing:.08em;color:#fff;display:block;line-height:1.1}
.brand .w2{font-size:.8rem;letter-spacing:.1em;color:var(--teal-light);display:block;line-height:1.1}
.back{font-size:.85rem;color:rgba(255,255,255,.65);text-decoration:none;font-weight:700}
.back:hover{color:#fff}

/* CARD */
main{padding:3rem 0 4rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:2.5rem}
h1{font-family:'Playfair Display',serif;font-size:2rem;line-height:1.2;color:var(--navy);margin-bottom:1rem}
h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--navy);line-height:1.3;margin-bottom:.75rem}
p{color:var(--mid)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:.7rem}
.lead{font-size:1.05rem;margin-bottom:1rem}
.meta{font-size:.9rem;color:var(--muted);margin:1.5rem 0 2rem;padding-top:1.25rem;border-top:1px solid #eef3f2}
.btn{display:inline-block;background:var(--amber);color:var(--navy);padding:.85rem 1.9rem;border:none;border-radius:4px;font-family:'Lato',sans-serif;font-weight:700;font-size:.93rem;letter-spacing:.03em;cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:#d49218}
.btn[disabled]{background:#dfe7e6;color:#9bb0ae;cursor:not-allowed}
.btn-quiet{background:none;border:none;color:var(--muted);font-family:'Lato',sans-serif;font-size:.86rem;text-decoration:underline;cursor:pointer;padding:0}
.btn-quiet:hover{color:var(--mid)}

/* CHOOSER */
.choices{display:flex;flex-direction:column;gap:.75rem;margin-top:1.75rem}
.choice{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;text-align:left;background:#fff;border:1px solid #d8e6e3;border-radius:8px;padding:1.15rem 1.35rem;cursor:pointer;font-family:'Lato',sans-serif;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--teal);background:var(--light2)}
.choice .t{display:block;font-weight:700;font-size:1.02rem;color:var(--navy);margin-bottom:.2rem}
.choice .d{display:block;font-size:.92rem;color:var(--mid);line-height:1.5}
.choice svg{flex-shrink:0;color:var(--teal)}

/* PROGRESS */
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.6rem}
.prog-label{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.prog-count{font-size:.8rem;color:var(--muted);white-space:nowrap}
.prog-track{height:4px;background:#e6eeed;border-radius:2px;overflow:hidden;margin-bottom:2.25rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .35s ease}

/* QUESTIONS */
.q{margin-bottom:2rem}
.q-text{font-size:1.08rem;font-weight:700;color:var(--navy);margin-bottom:.9rem;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dde8e6;border-radius:6px;padding:.8rem 1rem;margin-bottom:.5rem;font-family:'Lato',sans-serif;font-size:.95rem;color:var(--mid);cursor:pointer;transition:border-color .15s,background .15s;line-height:1.45}
.opt:hover{border-color:var(--teal);background:var(--light2)}
.opt.sel{border-color:var(--teal);background:var(--light);color:var(--navy);font-weight:700}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #eef3f2}

/* RESULTS */
.res-top{padding-bottom:1.75rem;border-bottom:1px solid #eef3f2;margin-bottom:2rem}
.res-sum{font-size:1.02rem}
.strong-line{margin-top:1rem;font-size:.97rem;color:var(--navy)}
.sec-title{font-size:.75rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--teal);margin-bottom:1.25rem}
.block{margin-bottom:2.5rem}
.radar{display:block;margin:0 auto;width:100%;max-width:440px;height:auto}
.dim{margin-bottom:1rem}
.dim-head{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem;margin-bottom:.35rem}
.dim-head .nm{font-weight:700;color:var(--navy)}
.dim-head .sc{color:var(--muted);font-size:.82rem;white-space:nowrap}
.dim-track{height:7px;background:#e9f0ef;border-radius:4px;overflow:hidden}
.dim-fill{height:100%;border-radius:4px;background:var(--teal);width:0;transition:width .8s ease}
.tip{background:var(--light);border-left:3px solid var(--amber);border-radius:0 5px 5px 0;padding:1.15rem 1.35rem;margin-bottom:.85rem}
.tip h3{font-family:'Lato',sans-serif;font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:.35rem}
.tip p{font-size:.93rem;line-height:1.6}
.cta{background:var(--teal);border-radius:8px;padding:2rem;text-align:center;margin-top:2.5rem}
.cta h3{font-family:'Playfair Display',serif;font-size:1.35rem;color:#fff;margin-bottom:.75rem}
.cta p{color:rgba(255,255,255,.88);font-size:.97rem;max-width:470px;margin:0 auto 1.5rem}
.cta a{display:inline-block;background:#fff;color:var(--teal);padding:.8rem 1.9rem;border-radius:4px;font-weight:700;font-size:.93rem;text-decoration:none}
.cta a:hover{background:#f0faf9}
.after{display:flex;justify-content:center;gap:1.75rem;flex-wrap:wrap;margin-top:1.5rem}
footer{padding:2rem 0 3rem;text-align:center}
footer p{font-size:.82rem;color:var(--muted)}
footer a{color:var(--teal);text-decoration:none}

@media(max-width:640px){
  .card{padding:1.75rem 1.25rem}
  h1{font-size:1.6rem}
  main{padding:2rem 0 3rem}
  .wrap{padding:0 1rem}
}
</style>
</head>

<main>

      </div>

      <div class="block">

      </div>

        <div class="sec-title">Area by area</div>
        <div id="dims"></div>
      </div>

      <div class="block" id="tipsBlock" style="margin-bottom:0">
        <div class="sec-title">Where to start</div>
        <div id="tips"></div>
      </div>

      <div class="cta">
        <h3 id="ctaTitle"></h3>
        <p id="ctaText"></p>
        <a href="mailto:hello@impactfactor.co.uk">hello@impactfactor.co.uk</a>
      </div>

      <div class="after">
        <button class="btn-quiet" id="retake">Take it again</button>
        <button class="btn-quiet" id="toChooser2">Try another version</button>
      </div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap"><p>Impact Factor. <a href="index.html">Back to the site</a></p></div>
</footer>

    "tips": {

    "summaries": [
      {

// ---------------------------------------------------------------------------
// ENGINE. No need to edit below this line to change wording.
// ---------------------------------------------------------------------------
var el = function(id){ return document.getElementById(id); };
var track = null, key = null, answers = {}, secIdx = 0;
var SCREENS = ["chooser","intro","quiz","results"];

function show(id){
  SCREENS.forEach(function(s){ el(s).classList.toggle("hidden", s !== id); });
  window.scrollTo({ top:0, behavior:"smooth" });
}
function setHash(h){
  try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch(e) {}
}

// Chooser
el("chEyebrow").textContent = SHARED.chooserEyebrow;
el("chTitle").textContent = SHARED.chooserTitle;
el("chLead").textContent = SHARED.chooserLead;
el("chPrivacy").textContent = SHARED.privacy;
el("inPrivacy").textContent = SHARED.privacy;
el("ctaTitle").textContent = SHARED.ctaTitle;

var arrow = '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1L15 8L8 15M15 8H1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
el("choices").innerHTML = ORDER.map(function(k){
  return '<button class="choice" data-k="' + k + '"><span><span class="t">' + TRACKS[k].label +
         '</span><span class="d">' + TRACKS[k].blurb + '</span></span>' + arrow + '</button>';
}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".choice"), function(b){
  b.addEventListener("click", function(){ openTrack(b.dataset.k); });
});

function openTrack(k){
  key = k; track = TRACKS[k]; answers = {}; secIdx = 0;
  el("inEyebrow").textContent = track.label;
  el("inTitle").textContent = track.title;
  el("inLead").textContent = track.lead;
  setHash(k);
  show("intro");
}
function toChooser(){ key = null; track = null; setHash(""); show("chooser"); }

el("toChooser1").addEventListener("click", toChooser);
el("toChooser2").addEventListener("click", toChooser);
el("start").addEventListener("click", function(){ renderSection(); show("quiz"); });

// Questions
function renderSection(){
  var sec = track.sections[secIdx];
  el("secName").textContent = sec.title;
  el("secCount").textContent = "Section " + (secIdx+1) + " of " + track.sections.length;
  el("progFill").style.width = (secIdx / track.sections.length * 100) + "%";

  var html = "";
  sec.questions.forEach(function(q, qi){
    var k = sec.id + "-" + qi;
    html += '<div class="q"><div class="q-text">' + q.text + '</div>';
    q.opts.forEach(function(o, oi){
      var on = answers[k] === (oi+1);
      html += '<button class="opt' + (on ? " sel" : "") + '" aria-pressed="' + on + '" data-k="' + k + '" data-v="' + (oi+1) + '">' + o + '</button>';
    });
    html += '</div>';
  });
  el("qArea").innerHTML = html;
  Array.prototype.forEach.call(el("qArea").querySelectorAll(".opt"), function(b){
    b.addEventListener("click", function(){
      answers[b.dataset.k] = parseInt(b.dataset.v, 10);
      var y = window.scrollY; renderSection(); window.scrollTo(0, y);
    });
  });

  el("back").style.visibility = secIdx === 0 ? "hidden" : "visible";
  el("next").textContent = secIdx === track.sections.length-1 ? "See my profile" : "Next";
  el("next").disabled = !sec.questions.every(function(q, qi){ return answers[sec.id + "-" + qi]; });
}
el("next").addEventListener("click", function(){
  if (secIdx === track.sections.length-1){ showResults(); }
  else { secIdx++; renderSection(); window.scrollTo({ top:0, behavior:"smooth" }); }
});
el("back").addEventListener("click", function(){
  if (secIdx > 0){ secIdx--; renderSection(); window.scrollTo({ top:0, behavior:"smooth" }); }
});

// Results
function dimScores(){
  return track.sections.map(function(sec){
    var v = sec.questions.reduce(function(t, q, qi){ return t + (answers[sec.id + "-" + qi] || 0); }, 0);
    return { id:sec.id, title:sec.title, value:v };
  });
}
function joinNames(list){
  if (list.length === 1) return list[0];
  return list.slice(0, -1).join(", ") + " and " + list[list.length-1];
}

function showResults(){
  var dims = dimScores();
  var total = dims.reduce(function(t, d){ return t + d.value; }, 0);
  var summary = track.summaries.filter(function(s){ return total >= s.min; })[0];

  el("resEyebrow").textContent = track.label;
  el("resSummary").textContent = summary.text;

  var max = Math.max.apply(null, dims.map(function(d){ return d.value; }));
  var min = Math.min.apply(null, dims.map(function(d){ return d.value; }));
  if (max === min) {
    el("resStrong").textContent = max === 8 ? "Your answers are at the top of the scale in all six areas." : "Your answers are even across all six areas.";
  } else {
    var top = dims.filter(function(d){ return d.value === max; }).map(function(d){ return d.title; });
    el("resStrong").textContent = "Your answers are strongest on " + joinNames(top) + ".";
  }

  el("dims").innerHTML = dims.map(function(d){
    return '<div class="dim"><div class="dim-head"><span class="nm">' + d.title + '</span><span class="sc">' +
           d.value + ' of 8</span></div><div class="dim-track"><div class="dim-fill" data-w="' +
           (d.value / 8 * 100) + '"></div></div></div>';
  }).join("");

  var weakest = dims.slice().sort(function(a, b){ return a.value - b.value; }).slice(0, 2);
  el("tips").innerHTML = weakest.map(function(d){
    return '<div class="tip"><h3>' + d.title + '</h3><p>' + track.tips[d.id] + '</p></div>';
  }).join("");

  el("tipsBlock").classList.toggle("hidden", min === 8);
  el("ctaText").textContent = track.cta;
  drawRadar(dims);
  show("results");
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll(".dim-fill"), function(f){ f.style.width = f.dataset.w + "%"; });
  }, 150);
}

function drawRadar(dims){
  var cx = 220, cy = 160, R = 110, n = dims.length;
  function pt(i, r){ var a = (Math.PI*2*i/n) - Math.PI/2; return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; }
  var s = "";
  [0.25, 0.5, 0.75, 1].forEach(function(f){
    var p = []; for (var i=0; i<n; i++){ p.push(pt(i, R*f).join(",")); }
    s += '<polygon points="' + p.join(" ") + '" fill="none" stroke="#dfeae8" stroke-width="1"/>';
  });
  for (var i=0; i<n; i++){ var e = pt(i, R); s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#dfeae8" stroke-width="1"/>'; }
  var dp = dims.map(function(d, i){ return pt(i, R * d.value / 8).join(","); });
  s += '<polygon points="' + dp.join(" ") + '" fill="#0B8A7A" fill-opacity="0.2" stroke="#0B8A7A" stroke-width="2"/>';
  dims.forEach(function(d, i){ var p = pt(i, R * d.value / 8); s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#0B8A7A"/>'; });
  dims.forEach(function(d, i){
    var p = pt(i, R + 22);
    var anchor = Math.abs(p[0]-cx) < 12 ? "middle" : (p[0] > cx ? "start" : "end");
    var dy = Math.abs(p[0]-cx) < 12 ? (p[1] < cy ? -2 : 12) : 4;
    s += '<text x="'+p[0]+'" y="'+(p[1]+dy)+'" text-anchor="'+anchor+'" font-family="Lato,sans-serif" font-size="12" font-weight="700" fill="#3D5A73">' + d.title + '</text>';
  });
  el("radar").innerHTML = s;
}

el("retake").addEventListener("click", function(){ openTrack(key); });

// Direct links: impact-readiness.html#researchers, #managers or #funders
function route(){
  var h = (location.hash || "").replace("#", "");
  if (TRACKS[h]) { if (h !== key) { openTrack(h); } }
  else { toChooser(); }
}
window.addEventListener("hashchange", route);
route();
</script>
